
# Cloud Build: the checks that run on every pull request.

steps:
  - id: install
    dir: week1
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        python -m venv /workspace/.venv
        /workspace/.venv/bin/pip install --quiet --upgrade pip
        /workspace/.venv/bin/pip install --quiet -r requirements.txt

  - id: lint
    dir: week1
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - /workspace/.venv/bin/python -m ruff check .

  - id: test
    dir: week1
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - /workspace/.venv/bin/python -m pytest -q

  - id: gate
    dir: week1
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - /workspace/.venv/bin/python -m scripts.quality_gate

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
